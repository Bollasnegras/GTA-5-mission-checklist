<!DOCTYPE html>
<html>
<head>
  <title>GTA V Ultimate Tracker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a0a, #111827, #000000);
      color: white;
    }

    .overlay {
      min-height: 100vh;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-top: 0;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }

    h2 {
      border-left: 4px solid #00ff88;
      padding-left: 10px;
      margin-top: 25px;
      color: #00ffcc;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab {
      padding: 10px 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(0,255,136,0.2);
    }

    .tab.active {
      background: rgba(0,255,136,0.2);
      box-shadow: 0 0 10px rgba(0,255,136,0.4);
    }

    .counter {
      color: #00ff88;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .mission {
      display: block;
      padding: 8px;
      margin: 4px 0;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      border: 1px solid rgba(0,255,136,0.1);
    }

    .mission:hover {
      background: rgba(0,255,136,0.15);
      transform: translateX(5px);
    }

    .gold {
      margin-left: 10px;
      color: gold;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
<div class="overlay">

<h1>GTA V ULTIMATE TRACKER</h1>

<input type="text" id="search" placeholder="Search missions..." onkeyup="filterMissions()">

<div class="tabs">
  <div class="tab active" onclick="switchTab('missions', event)">Missions</div>
  <div class="tab" onclick="switchTab('sf', event)">Strangers & Freaks</div>
</div>

<div id="missionsTab">
  <div class="counter" id="storyCounter"></div>
  <div id="storyList"></div>
</div>

<div id="sfTab" class="hidden">
  <div class="counter" id="sfCounter"></div>
  <div id="sfList"></div>
</div>

</div>

<script>
window.onload = function () {

// FULL STORY MISSIONS
const storyMissions = [
"Prologue","Franklin and Lamar","Repossession","Complications","Father/Son",
"Marriage Counseling","Chop","Friend Request","The Long Stretch",
"Casing the Jewel Store","The Jewel Store Job","Mr. Phillips",
"Trevor Philips Industries","Nervous Ron","Crystal Maze","Friends Reunited",
"Fame or Shame","Dead Man Walking","Three’s Company","By the Book",
"Hood Safari","Scouting the Port","Minisub","The Merryweather Heist",
"Did Somebody Say Yoga?","Hotel Assassination","Blitz Play","Mr. Richards",
"I Fought the Law","Eye in the Sky","Caida Libre","Deep Inside",
"Minor Turbulence","Paleto Score Setup","The Paleto Score","Derailed",
"Monkey Business","Hang Ten","Surveying the Score","Bury the Hatchet",
"Pack Man","Fresh Meat","Cleaning Out the Bureau","The Bureau Raid",
"Reuniting the Family","Architect’s Plans","The Big Score (Subtle)",
"The Big Score (Obvious)","The Wrap Up","Lamar Down",
"Meltdown","The Time's Come","Something Sensible","The Third Way"
];

// FULL STRANGERS & FREAKS
const sfMissions = [
"Tonya - Pulling Favors","Tonya - Another Favor","Tonya - Still Pulling","Tonya - Final Favor",
"Beverly - Paparazzo","Beverly - Sex Tape","Beverly - Partnership","Beverly - Reality Check","Beverly - Meltdown",
"Barry - Grass Roots (Michael)","Barry - Grass Roots (Trevor)","Barry - Grass Roots (Franklin)",
"Dom - Risk Assessment","Dom - Liquidity Risk","Dom - Targeted Risk","Dom - Uncalculated Risk",
"Cletus - Target Practice","Cletus - Fair Game",
"Josh - Extra Commission","Josh - Closing the Deal","Josh - Surreal Estate",
"Dreyfuss - A Starlet in Vinewood",
"Epsilon - Seeking the Truth","Epsilon - Accepting the Truth","Epsilon - Assuming the Truth",
"Maude - Bail Bonds","Nigel & Mrs Thornhill","Omega - Far Out","Abigail - Death at Sea"
];

// CREATE LIST
function createList(list, containerId, prefix) {
  const container = document.getElementById(containerId);
  list.forEach((name, i) => {
    const id = prefix + i;
    container.innerHTML += `
      <label class="mission">
        <input type="checkbox" id="${id}" onchange="saveData()">
        ${name}
        <input type="checkbox" id="${id}_gold" class="gold" onchange="saveData()"> ⭐
      </label>
    `;
  });
}

// BUILD LISTS
createList(storyMissions, "storyList", "s");
createList(sfMissions, "sfList", "sf");

const checkboxes = document.querySelectorAll("input[type='checkbox']");

// COUNTERS
function updateCounters() {
  const storyBoxes = [...checkboxes].filter(cb => cb.id.startsWith("s") && !cb.id.includes("gold"));
  const sfBoxes = [...checkboxes].filter(cb => cb.id.startsWith("sf") && !cb.id.includes("gold"));

  document.getElementById("storyCounter").textContent =
    `Story Missions: ${storyBoxes.filter(cb => cb.checked).length} / ${storyBoxes.length}`;

  document.getElementById("sfCounter").textContent =
    `Strangers & Freaks: ${sfBoxes.filter(cb => cb.checked).length} / ${sfBoxes.length}`;
}

// SAVE / LOAD
function saveData() {
  const data = {};
  checkboxes.forEach(cb => data[cb.id] = cb.checked);
  localStorage.setItem("gtaTracker", JSON.stringify(data));
  updateCounters();
}

function loadData() {
  const saved = JSON.parse(localStorage.getItem("gtaTracker"));
  if (!saved) return;

  checkboxes.forEach(cb => {
    if (saved[cb.id] !== undefined) cb.checked = saved[cb.id];
  });

  updateCounters();
}

// SEARCH
window.filterMissions = function () {
  const search = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".mission").forEach(m => {
    m.style.display = m.textContent.toLowerCase().includes(search) ? "block" : "none";
  });
};

// TABS
window.switchTab = function(tab, e) {
  document.getElementById("missionsTab").classList.toggle("hidden", tab !== "missions");
  document.getElementById("sfTab").classList.toggle("hidden", tab !== "sf");

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  e.target.classList.add("active");
};

loadData();

};
</script>

</body>
</html>
