<!DOCTYPE html>
<html>
<head>
  <title>GTA V Ultimate Tracker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a0a, #111827, #000000);
      color: white;
    }

    .overlay {
      min-height: 100vh;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-top: 0;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }

    h2 {
      border-left: 4px solid #00ff88;
      padding-left: 10px;
      margin-top: 25px;
      color: #00ffcc;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab {
      padding: 10px 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(0,255,136,0.2);
    }

    .tab.active {
      background: rgba(0,255,136,0.2);
      box-shadow: 0 0 10px rgba(0,255,136,0.4);
    }

    .counter {
      color: #00ff88;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .mission {
      display: block;
      padding: 8px;
      margin: 4px 0;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      border: 1px solid rgba(0,255,136,0.1);
    }

    .mission:hover {
      background: rgba(0,255,136,0.15);
      transform: translateX(5px);
    }

    .gold {
      margin-left: 10px;
      color: gold;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
<div class="overlay">

<h1>GTA V ULTIMATE TRACKER</h1>

<input type="text" id="search" placeholder="Search missions..." onkeyup="filterMissions()">

<div class="tabs">
  <div class="tab active" onclick="switchTab('missions')">Missions</div>
  <div class="tab" onclick="switchTab('sf')">Strangers & Freaks</div>
</div>

<div id="missionsTab">
  <h2>Franklin</h2>
  <div class="counter" id="fCounter"></div>
  <div id="fList"></div>

  <h2>Michael</h2>
  <div class="counter" id="mCounter"></div>
  <div id="mList"></div>

  <h2>Trevor</h2>
  <div class="counter" id="tCounter"></div>
  <div id="tList"></div>
</div>

<div id="sfTab" class="hidden">
  <h2>Franklin</h2>
  <div id="sfFList"></div>

  <h2>Michael</h2>
  <div id="sfMList"></div>

  <h2>Trevor</h2>
  <div id="sfTList"></div>
</div>

</div>

<script>
window.onload = function () {

// STORY MISSIONS BY CHARACTER
const franklin = ["Franklin and Lamar","Repossession","Chop","The Long Stretch","Hood Safari"];
const michael = ["Marriage Counseling","Friend Request","Casing the Jewel Store","The Jewel Store Job","Dead Man Walking"];
const trevor = ["Mr. Phillips","Trevor Philips Industries","Nervous Ron","Crystal Maze"];

// STRANGERS & FREAKS
const sfFranklin = ["Tonya 1","Tonya 2","Tonya 3","Tonya 4","Beverly 1","Beverly 2"];
const sfMichael = ["Barry 1","Barry 2","Epsilon 1","Epsilon 2"];
const sfTrevor = ["Dom 1","Dom 2","Dom 3","Dom 4","Maude","Nigel"];

// CREATE LIST FUNCTION
function createList(list, containerId, prefix) {
  const container = document.getElementById(containerId);
  list.forEach((name, i) => {
    const id = prefix + i;
    container.innerHTML += `
      <label class="mission">
        <input type="checkbox" id="${id}" onchange="saveData()">
        ${name}
        <input type="checkbox" id="${id}_gold" class="gold" onchange="saveData()"> ⭐
      </label>
    `;
  });
}

// BUILD LISTS
createList(franklin, "fList", "f");
createList(michael, "mList", "m");
createList(trevor, "tList", "t");

createList(sfFranklin, "sfFList", "sff");
createList(sfMichael, "sfMList", "sfm");
createList(sfTrevor, "sfTList", "sft");

const checkboxes = document.querySelectorAll("input[type='checkbox']");

// COUNTERS
function updateCounters() {
  const count = (prefix) =>
    [...checkboxes].filter(cb => cb.id.startsWith(prefix) && !cb.id.includes("gold") && cb.checked).length;

  document.getElementById("fCounter").textContent = `Completed: ${count("f")}`;
  document.getElementById("mCounter").textContent = `Completed: ${count("m")}`;
  document.getElementById("tCounter").textContent = `Completed: ${count("t")}`;
}

// SAVE / LOAD
function saveData() {
  const data = {};
  checkboxes.forEach(cb => data[cb.id] = cb.checked);
  localStorage.setItem("gtaTracker", JSON.stringify(data));
  updateCounters();
}

function loadData() {
  const saved = JSON.parse(localStorage.getItem("gtaTracker"));
  if (!saved) return;

  checkboxes.forEach(cb => {
    if (saved[cb.id] !== undefined) cb.checked = saved[cb.id];
  });

  updateCounters();
}

// SEARCH
window.filterMissions = function () {
  const search = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".mission").forEach(m => {
    m.style.display = m.textContent.toLowerCase().includes(search) ? "block" : "none";
  });
};

// TABS
window.switchTab = function(tab) {
  document.getElementById("missionsTab").classList.toggle("hidden", tab !== "missions");
  document.getElementById("sfTab").classList.toggle("hidden", tab !== "sf");

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
};

loadData();

};
</script>

</body>
</html>
