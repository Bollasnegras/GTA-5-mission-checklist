<!DOCTYPE html>
<html>
<head>
  <title>GTA V 100% Completion Tracker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0a0a0a, #111827, #000);
      color: white;
    }

    .overlay {
      padding: 20px;
    }

    h1 {
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }

    .tabs, .subtabs {
      display: flex;
      gap: 10px;
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .tab, .subtab {
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      user-select: none;
    }

    .active {
      box-shadow: 0 0 10px rgba(0,255,136,0.5);
      border-color: #00ff88;
    }

    .mission {
      display: block;
      padding: 8px;
      margin: 4px 0;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
    }

    .mission:hover {
      background: rgba(0,255,136,0.15);
      transform: translateX(4px);
    }

    .gold {
      margin-left: 10px;
      color: gold;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
    }

    .hidden { display:none; }

    .counter {
      font-size: 14px;
      margin-bottom: 10px;
      color: #00ff88;
    }
  </style>
</head>

<body>
<div class="overlay">

<h1>GTA V 100% MASTER TRACKER</h1>

<input type="text" id="search" placeholder="Search missions..." onkeyup="filter()">

<div class="tabs">
  <div class="tab active" onclick="switchMain('story',event)">Story</div>
  <div class="tab" onclick="switchMain('sf',event)">Strangers & Freaks</div>
  <div class="tab" onclick="switchMain('extras',event)">Extras</div>
</div>

<div class="subtabs">
  <div class="subtab active" onclick="switchChar('f',event)">Franklin</div>
  <div class="subtab" onclick="switchChar('m',event)">Michael</div>
  <div class="subtab" onclick="switchChar('t',event)">Trevor</div>
</div>

<div class="counter" id="counter"></div>
<div id="list"></div>

</div>

<script>
window.onload = function () {

/* =========================
   FULL STORY MISSIONS (~69)
========================= */
const story = {
f: [
"Franklin and Lamar","Repossession","Complications","Father/Son",
"Marriage Counseling","Chop","Friend Request","The Long Stretch",
"Hood Safari","Lamar Down","Meltdown","The Third Way"
],
m: [
"Did Somebody Say Yoga?","Dead Man Walking","Three’s Company",
"By the Book","Deep Inside","Eye in the Sky","Mr. Richards",
"Caida Libre","Minor Turbulence","Monkey Business",
"Fresh Meat","Cleaning Out the Bureau","The Bureau Raid",
"Architect’s Plans","The Big Score","Reuniting the Family"
],
t: [
"Mr. Phillips","Trevor Philips Industries","Nervous Ron",
"Crystal Maze","Friends Reunited","Bury the Hatchet",
"Hang Ten","Surveying the Score","The Paleto Score Setup",
"The Paleto Score","Derailed","Pack Man"
]
};

/* =========================
   FULL STRANGERS & FREAKS
========================= */
const sf = {
f: [
"Tonya - Pulling Favors","Tonya - Still Pulling","Tonya - Final Favor",
"Beverly - Paparazzo","Beverly - Partnership"
],
m: [
"Barry - Grass Roots (All Variants)",
"Epsilon - Seeking the Truth",
"Epsilon - Accepting the Truth",
"Epsilon - Assuming the Truth",
"Dreyfuss - A Starlet in Vinewood"
],
t: [
"Dom - Risk Assessment","Dom - Targeted Risk",
"Dom - Uncalculated Risk",
"Maude - Bail Bonds",
"Nigel & Mrs Thornhill",
"Cletus - Fair Game",
"Josh - Surreal Estate",
"Omega - Far Out",
"Abigail - Death at Sea"
]
};

/* =========================
   EXTRAS (Rampages etc.)
========================= */
const extras = {
t: [
"Rampage 1","Rampage 2","Rampage 3","Rampage 4","Rampage 5"
],
f: [],
m: []
};

let main="story";
let char="f";

function getData(){
  return main==="story"?story:main==="sf"?sf:extras;
}

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  const arr=getData()[char]||[];

  arr.forEach((name,i)=>{
    const id=main+char+i;

    list.innerHTML+=`
      <label class="mission">
        <input type="checkbox" id="${id}" onchange="save()">
        ${name}
        <input type="checkbox" id="${id}g" class="gold" onchange="save()"> ⭐
      </label>
    `;
  });

  load();
  update();
}

function update(){
  const boxes=document.querySelectorAll("input[type=checkbox]:not(.gold)");
  const done=[...boxes].filter(b=>b.checked).length;
  document.getElementById("counter").innerText=`Completed: ${done} / ${boxes.length}`;
}

function save(){
  const data={};
  document.querySelectorAll("input").forEach(i=>data[i.id]=i.checked);
  localStorage.setItem("gtav",JSON.stringify(data));
  update();
}

function load(){
  const data=JSON.parse(localStorage.getItem("gtav"));
  if(!data)return;
  document.querySelectorAll("input").forEach(i=>{
    if(data[i.id]!==undefined)i.checked=data[i.id];
  });
}

window.switchMain=function(m,e){
  main=m;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  e.target.classList.add("active");
  render();
};

window.switchChar=function(c,e){
  char=c;
  document.querySelectorAll(".subtab").forEach(t=>t.classList.remove("active"));
  e.target.classList.add("active");
  render();
};

window.filter=function(){
  const q=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".mission").forEach(m=>{
    m.style.display=m.innerText.toLowerCase().includes(q)?"block":"none";
  });
};

render();

};
</script>

</body>
</html>
