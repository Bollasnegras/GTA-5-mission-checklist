<!DOCTYPE html>
<html>
<head>
  <title>GTA 5 Ultimate Tracker</title>

  <style>
    body {
      margin: 0;
      background: url('https://i.imgur.com/3ZQ3Z8F.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial;
      color: white;
    }

    .overlay {
      background: rgba(0,0,0,0.8);
      min-height: 100vh;
      padding: 20px;
    }

    h1 { margin: 0 0 10px; }

    h2 {
      border-left: 4px solid #00ff88;
      padding-left: 10px;
      margin-top: 25px;
    }

    .counter {
      color: #00ff88;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .mission {
      display: block;
      padding: 6px;
      margin: 2px 0;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
    }

    .gold {
      margin-left: 10px;
      color: gold;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }
  </style>
</head>

<body>
<div class="overlay">

<h1>GTA V ULTIMATE TRACKER</h1>

<input type="text" id="search" placeholder="Search missions..." onkeyup="filterMissions()">

<h2>Story Missions</h2>
<div class="counter" id="storyCounter"></div>
<div id="storyList"></div>

<h2>Strangers & Freaks</h2>
<div class="counter" id="sfCounter"></div>
<div id="sfList"></div>

</div>

<script>
window.onload = function () {

const storyMissions = [
"Prologue","Franklin and Lamar","Repossession","Complications","Father/Son",
"Marriage Counseling","Chop","Friend Request","The Long Stretch","Casing the Jewel Store",
"The Jewel Store Job","Mr. Phillips","Trevor Philips Industries","Nervous Ron",
"Crystal Maze","Friends Reunited","Fame or Shame","Dead Man Walking",
"Three’s Company","By the Book","Hood Safari","Scouting the Port",
"Minisub","The Merryweather Heist","Blitz Play","Mr. Richards",
"I Fought the Law","Eye in the Sky","Caida Libre","Deep Inside",
"Minor Turbulence","Paleto Score Setup","The Paleto Score","Derailed",
"Monkey Business","Hang Ten","Surveying the Score","Bury the Hatchet",
"Pack Man","Fresh Meat","Cleaning Out the Bureau","The Bureau Raid",
"Reuniting the Family","Architect’s Plans","The Big Score (Subtle)",
"The Big Score (Obvious)","The Wrap Up","Lamar Down",
"Ending A","Ending B","Ending C"
];

const sfMissions = [
"Tonya 1","Tonya 2","Tonya 3","Tonya 4",
"Beverly 1","Beverly 2","Beverly 3","Beverly 4","Beverly 5",
"Barry 1","Barry 2","Barry 3","Barry 4",
"Dom 1","Dom 2","Dom 3","Dom 4",
"Cletus","Josh","Dreyfuss","Epsilon 1","Epsilon 2",
"Maude","Nigel","Omega","Abigail"
];

const storyList = document.getElementById("storyList");
const sfList = document.getElementById("sfList");

function createList(list, container, prefix) {
  list.forEach((name, i) => {
    const id = prefix + i;

    container.innerHTML += `
      <label class="mission">
        <input type="checkbox" id="${id}" onchange="saveData()">
        ${name}
        <input type="checkbox" id="${id}_gold" class="gold" onchange="saveData()"> ⭐
      </label>
    `;
  });
}

createList(storyMissions, storyList, "s");
createList(sfMissions, sfList, "sf");

const checkboxes = document.querySelectorAll("input[type='checkbox']");

function updateCounters() {
  const storyBoxes = [...checkboxes].filter(cb => cb.id.startsWith("s") && !cb.id.includes("gold"));
  const sfBoxes = [...checkboxes].filter(cb => cb.id.startsWith("sf") && !cb.id.includes("gold"));

  const storyDone = storyBoxes.filter(cb => cb.checked).length;
  const sfDone = sfBoxes.filter(cb => cb.checked).length;

  document.getElementById("storyCounter").textContent =
    `Story Missions: ${storyDone} / ${storyBoxes.length}`;

  document.getElementById("sfCounter").textContent =
    `Strangers & Freaks: ${sfDone} / ${sfBoxes.length}`;
}

function saveData() {
  const data = {};
  checkboxes.forEach(cb => data[cb.id] = cb.checked);
  localStorage.setItem("gtaTracker", JSON.stringify(data));
  updateCounters();
}

function loadData() {
  const saved = JSON.parse(localStorage.getItem("gtaTracker"));
  if (!saved) return;

  checkboxes.forEach(cb => {
    if (saved[cb.id] !== undefined) cb.checked = saved[cb.id];
  });

  updateCounters();
}

window.filterMissions = function () {
  const search = document.getElementById("search").value.toLowerCase();
  const missions = document.querySelectorAll(".mission");

  missions.forEach(m => {
    m.style.display = m.textContent.toLowerCase().includes(search)
      ? "block"
      : "none";
  });
};

loadData();

};
</script>

</body>
</html>
